<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="7 Ways - Premium roster and booking service. Available in English, Japanese, Chinese and Korean.">
  <meta name="keywords" content="7 Ways, roster, booking, premium service">
  <meta name="author" content="7 Ways">
  <meta property="og:site_name" content="7 Ways">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="en_US">
  <meta property="og:locale:alternate" content="ja_JP">
  <meta property="og:locale:alternate" content="zh_CN">
  <meta property="og:locale:alternate" content="ko_KR">
  <link rel="alternate" hreflang="en" href="contact.html">
  <link rel="alternate" hreflang="ja" href="contact.html">
  <link rel="alternate" hreflang="zh" href="contact.html">
  <link rel="alternate" hreflang="ko" href="contact.html">
  <link rel="alternate" hreflang="x-default" href="contact.html">
  <meta name="google" content="notranslate">
  <title>Contact Us | 7 Ways</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
  <div class="site-top">
<header>
    <nav>
      <a href="index.html" class="logo">
        
        <div class="logo-text">Black Garter<br><span>7 ways</span></div>
      </a>
      <ul class="nav-links">
        <li><a href="index.html" data-i18n="nav_home">Home</a></li>
        <li><a href="roster.html" data-i18n="nav_roster">Roster</a></li>
        <li><a href="pricing.html" data-i18n="nav_pricing">Pricing</a></li>
        <li><a href="employment.html" data-i18n="nav_employment">Employment</a></li>
        <li><a href="contact.html" class="active" data-i18n="nav_contact">Contact Us</a></li>
      </ul>
    </nav>
  </header>
<div class="lang-bar">
    <div class="lang-switcher">
      <button class="lang-btn active" data-lang="en" title="English"><img src="images/flag-en.png" alt="English"></button>
      <button class="lang-btn" data-lang="ja" title="日本語"><img src="images/flag-ja.png" alt="日本語"></button>
      <button class="lang-btn" data-lang="zh" title="中文"><img src="images/flag-zh.png" alt="中文"></button>
      <button class="lang-btn" data-lang="ko" title="한국어"><img src="images/flag-ko.png" alt="한국어"></button>
    </div>
  </div>
  </div>

  <main>
    <h1 data-i18n="contact_title">Contact Us</h1>

    <section class="content-section">
      <h2>Call or Message Us</h2>
      <p style="font-size:1.15rem; margin-bottom:0.75rem;">
        <a href="tel:+61450351919" style="color:var(--red); font-weight:700; text-decoration:none;">📞 0450 351 919</a>
      </p>
      <p style="font-size:1.05rem; color:var(--text-muted);">
        WeChat ID: <strong style="color:#fff;">BG-7ways</strong>
      </p>
    </section>


    <section class="content-section">
      <h2 data-i18n="get_in_touch">Get In Touch</h2>
      <div id="contact-display" class="cms-text"></div>
    </section>

    <section class="content-section">
      <h2 data-i18n="quick_form">Quick Contact Form</h2>
      <form id="contact-form" onsubmit="event.preventDefault(); alert('Thank you!');">
        <div class="form-group">
          <label for="name" data-i18n="your_name">Your Name</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
          <label for="email" data-i18n="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
          <label for="message" data-i18n="message">Message</label>
          <textarea id="message" name="message" rows="5" required></textarea>
        </div>
        <button type="submit" class="btn" data-i18n="send_message">Send Message</button>
      </form>
    </section>
  </main>

  <footer>
    <p data-i18n="footer">&copy; 2026 7 Ways. All rights reserved.</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/script.js"></script>
</body>
</html>

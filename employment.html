  <div class="site-top">
<header>

        <div class="logo-text">Black Garter<br><span>7 ways</span></div>

      <ul class="nav-links">

        <li><a href="roster.html" data-i18n="nav_roster">Roster</a></li>

        <li><a href="contact.html" data-i18n="nav_contact">Contact Us</a></li>
      </ul>
    </nav>
  </header>
<div class="lang-bar">
    <div class="lang-switcher">
      <button class="lang-btn active" data-lang="en" title="English"><img src="images/flag-en.png" alt="English"></button>
      <button class="lang-btn" data-lang="ja" title="日本語"><img src="images/flag-ja.png" alt="日本語"></button>
      <button class="lang-btn" data-lang="zh" title="中文"><img src="images/flag-zh.png" alt="中文"></button>
      <button class="lang-btn" data-lang="ko" title="한국어"><img src="images/flag-ko.png" alt="한국어"></button>
    </div>
  </div>
  </div>

  <main>
    <h1 data-i18n="employment_title">Employment Application</h1>

    <section class="content-section">
      <p style="margin-bottom: 1.5rem; color: var(--text-muted);" data-i18n="employment_intro">
        Please fill in all fields below. All information is treated confidentially.
      </p>

      <form id="employment-form">
        <div class="form-group">
          <label for="emp-name"><span data-i18n="label_name">Full Name</span> <span style="color: var(--red);">*</span></label>
          <input type="text" id="emp-name" name="name" required data-i18n-placeholder="placeholder_name" placeholder="Enter your full name">
        </div>

        <div class="form-group">
          <label for="emp-nationality"><span data-i18n="label_nationality">Nationality</span> <span style="color: var(--red);">*</span></label>
          <input type="text" id="emp-nationality" name="nationality" required data-i18n-placeholder="placeholder_nationality" placeholder="e.g. Australian, French, etc.">
        </div>

        <div class="form-group">
          <label for="emp-age"><span data-i18n="label_age">Age</span> <span style="color: var(--red);">*</span></label>
          <input type="number" id="emp-age" name="age" required min="18" max="99" data-i18n-placeholder="placeholder_age" placeholder="Your age">
        </div>

        <div class="form-group">
          <label for="emp-contact"><span data-i18n="label_contact">Contact Number</span> <span style="color: var(--red);">*</span></label>
          <input type="tel" id="emp-contact" name="contact" required data-i18n-placeholder="placeholder_contact" placeholder="e.g. 04XX XXX XXX">
        </div>

        <div class="form-group">
          <label for="emp-photos">Photos (optional)</label>
          <input type="file" id="emp-photos" name="photos" accept="image/*" multiple>
          <p style="font-size:0.85rem;color:var(--text-muted);margin-top:0.4rem;">You can attach one or more photos (max about 3 MB each).</p>
        </div>

        <button type="submit" class="btn" data-i18n="submit_application">Submit Application</button>
      </form>
    </section>
  </main>

  <footer>
    <p data-i18n="footer">&copy; 2026 7 Ways. All rights reserved.</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
